  <style>
    path {
      transform-box: fill-box;
      transform-origin: 50% 55%;
    }

    svg:hover path {
      animation: excursions-scan 650ms cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes excursions-scan {
      0%, 100% { transform: translateY(0) rotate(0); }
      28% { transform: translateY(-3px) rotate(-1.5deg); }
      58% { transform: translateY(-3px) rotate(1.5deg); }
      82% { transform: translateY(-1px) rotate(-.4deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      svg:hover path { animation: none; }
    }
  </style>
